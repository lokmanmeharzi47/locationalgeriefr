<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="100%" height="100%">
  <defs>
    <!-- Background subtle soft gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F4F8FC"/>
    </radialGradient>

    <!-- Ring gradient: bright blue at top to deep navy at bottom -->
    <linearGradient id="ringGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#0088FF"/>
      <stop offset="35%" stop-color="#0077F0"/>
      <stop offset="70%" stop-color="#004EA8"/>
      <stop offset="100%" stop-color="#082142"/>
    </linearGradient>

    <!-- Wave divider gradient -->
    <linearGradient id="waveGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#0088FF" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#0077EE"/>
      <stop offset="100%" stop-color="#082142"/>
    </linearGradient>

    <!-- Soft shadow for the squircle container -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="24" stdDeviation="32" flood-color="#082142" flood-opacity="0.12"/>
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0088FF" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Squircle rounded background -->
  <rect x="24" y="24" width="976" height="976" rx="220" fill="url(#bgGrad)" filter="url(#softShadow)" />

  <!-- Outer Ring Circle -->
  <circle cx="512" cy="512" r="410" fill="none" stroke="url(#ringGrad)" stroke-width="26" stroke-linecap="round"/>

  <!-- Brand Typography -->
  <g text-anchor="middle" font-family="'Poppins', 'Montserrat', 'Segoe UI', system-ui, sans-serif">
    <!-- "LOCATION" in vibrant electric blue -->
    <text x="512" y="452"
          fill="#0084FF"
          font-size="124"
          font-weight="800"
          letter-spacing="5">LOCATION</text>

    <!-- "ALGÉRIE" in deep dark navy blue -->
    <text x="512" y="608"
          fill="#082142"
          font-size="142"
          font-weight="900"
          letter-spacing="7">ALGÉRIE</text>
  </g>

  <!-- Decorative stylized wave divider below ALGÉRIE -->
  <!-- Left tapered line, center double wave, right tapered line -->
  <path d="M 195 680
           C 280 679.5, 380 679, 430 678
           C 445 677.5, 452 662, 465 658
           C 475 655, 482 663, 492 672
           C 502 681, 508 682, 516 673
           C 526 663, 534 655, 545 658
           C 557 662, 563 677.5, 580 678
           C 630 679, 730 679.5, 829 680
           C 730 681.5, 630 682, 580 682.5
           C 564 683, 556 671, 545 667
           C 536 664, 528 672, 516 683
           C 507 692, 498 691, 490 681
           C 480 670, 472 663, 463 667
           C 453 671, 446 683, 430 682.5
           C 380 682, 280 681.5, 195 680 Z"
        fill="url(#ringGrad)"/>
</svg>
